# ============================================================================
# Loon 精简分流配置（模板）
# ----------------------------------------------------------------------------
# 这是 https://github.com/abobb414/loon-config 的 Loon-routing.conf 的最小骨架：
#   · 纯分流：不做 MITM、不跑脚本、不带插件
#   · 只看「哪条流量走哪个策略组」
#
# 用法：Fork 本仓库 → 改下面 5 处占位符 → 在 Loon 里用你 fork 后的 raw 地址订阅。
#   YOUR_TOKEN       机场订阅 token
#   YOUR_VPS_HOST    自建 VPS 地址（没有 VPS 就删掉 [Proxy] MyVPS 与 MyVPS-Group）
#   YOUR_HY2_PASSWORD / YOUR_SNI
#   USERNAME/PASSWORD 家里 mihomo 的 socks5 认证（没有家里回环就删掉 Home-Hub 与 WAN 两个 SSID 项）
#   YOUR_WIFI_1/2    家里 Wi-Fi 名（区分大小写，2.4G/5G 各算一个）
#
# 详细设计说明见 docs/build-your-own.md
# ============================================================================

[General]
ip-mode = prefer-v4
udp-fallback-mode = REJECT
dns-server = 223.5.5.5,119.29.29.29
hijack-dns = *:53
allow-udp-proxy = true
# 节点/机场 CDN 域名必须回真实 A 记录，否则 hijack-dns 会把它们解析成 Fake-IP，拨号直接回环
real-ip = *.example-airport.example,*.example-node.example
proxy-test-url = http://www.gstatic.com/generate_204
internet-test-url = http://cp.cloudflare.com/generate_204
# 1s 太激进，弱网节点会被误判失败导致 url-test 抖动
test-timeout = 3
geoip-url = https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb
ipasn-url = https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country-asn.mmdb
# 不要加 disable-udp-ports = 443：那是 MITM 时代的做法，纯分流下只会白丢 HTTP/3

[Proxy]
# 自建 VPS：Hysteria2 走 UDP，跨境比 TCP 抗丢包。没有就整行删除。
MyVPS = Hysteria2,YOUR_VPS_HOST,2086,"YOUR_HY2_PASSWORD",sni=YOUR_SNI,skip-cert-verify=true,udp=true
# 家里 mihomo 的 mixed 端口：必须是 socks5（http 不带 UDP ASSOCIATE，STUN/WebRTC 会泄漏直连）。
Home-Hub = socks5,192.168.1.10,7890,USERNAME,"PASSWORD",udp=true,block-quic=true

[Remote Proxy]
# 订阅地址含 token，永远不要提交到公开仓库；Fork 后填自己的。
Airport-A = https://example.com/subscribe?token=YOUR_TOKEN,udp=true,block-quic=true,fast-open=default,vmess-aead=default,skip-cert-verify=true,enabled=true,flexible-sni=false

[Proxy Group]
# 主出口：延迟最低的机场节点（包含订阅头部占位行的过滤器会把它带偏，见 [Remote Filter]）
Proxy = url-test,Airport-A-TW_Filter,Airport-A-Rest_Filter,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 100
# 自建 VPS 单独成组，方便手动切
MyVPS-Group = select,MyVPS
# AI 四个入口各自独立：默认 VPS，手动可切机场家宽兜底；一个被限流时只切一个
AI = select,MyVPS-Group,Airport-A-TW_Filter
Claude = select,MyVPS-Group,Airport-A-TW_Filter
OpenAI = select,MyVPS-Group,Airport-A-TW_Filter
Gemini = select,MyVPS-Group,Airport-A-TW_Filter
# 在家切到家里 mihomo，出门/蜂窝回落 Proxy。
# 注意：ssid 是唯一支持 default/cellular/"SSID" 的类型（select 组会静默忽略这些参数），
# 并且系统必须给 Loon 定位权限，否则读不到 Wi-Fi 名，永远落 default。
WAN = ssid,default=Proxy,cellular=Proxy,"YOUR_WIFI_1"=Home-Hub,"YOUR_WIFI_2"=Home-Hub
# 代理类业务统一引用 WAN：「在家」这个状态只维护一处
GitHub = select,WAN
YouTube = select,WAN
Netflix = select,WAN
Spotify = select,WAN,DIRECT
Steam = select,WAN,DIRECT
Epic = select,WAN,DIRECT
# 直连优先的业务
Apple = select,DIRECT,WAN
Bilibili = select,DIRECT,WAN
# 兜底
Final = select,WAN,DIRECT

[Remote Filter]
# 台湾家宽（按节点名抓，并排除订阅头部的流量/到期占位行）
Airport-A-TW_Filter = NameRegex,Airport-A, FilterKey = "(?i)^(?!.*(剩余流量|距离下次|套餐到期|官网)).*(HINET|ISP家宽)"
# 其余节点
Airport-A-Rest_Filter = NameRegex,Airport-A, FilterKey = "(?i)^(?!.*(剩余流量|距离下次|套餐到期|官网|HINET|ISP家宽)).*"

[Rule]
# 本地规则永远先于远程规则匹配；拦截类规则要写在白名单之前
# 订阅后端域名直连，否则拉订阅本身会走代理，容易被 TLS 重置
DOMAIN-SUFFIX,example-sub-backend.example,DIRECT
GEOIP,CN,DIRECT
FINAL,Final

[Remote Rule]
# 去广告：7 MB 级，量大命中高；嫌启动慢就 enabled=false，不要删行
https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules.list, policy=REJECT, tag=AdRules, enabled=true
# AI：每个引擎独立出口
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/OpenAI/OpenAI.list, policy=OpenAI, tag=OpenAI, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Claude/Claude.list, policy=Claude, tag=Claude, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Gemini/Gemini.list, policy=Gemini, tag=Gemini, enabled=true
https://github.com/fmz200/wool_scripts/raw/main/Loon/rule/AI.list, policy=AI, tag=AI, enabled=true
# 分类
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/GitHub/GitHub.list, policy=GitHub, tag=GitHub, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/YouTube/YouTube.list, policy=YouTube, tag=YouTube, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Netflix/Netflix.list, policy=Netflix, tag=Netflix, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Spotify/Spotify.list, policy=Spotify, tag=Spotify, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Steam/Steam.list, policy=Steam, tag=Steam, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Epic/Epic.list, policy=Epic, tag=Epic, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple.list, policy=Apple, tag=Apple, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/BiliBili/BiliBili.list, policy=Bilibili, tag=Bilibili, enabled=true
# 其余境外流量与国内直连
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy.list, policy=WAN, tag=Proxy, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Direct/Direct.list, policy=DIRECT, tag=Direct, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaMaxNoIP/ChinaMaxNoIP.list, policy=DIRECT, tag=ChinaMaxNoIP, enabled=true
