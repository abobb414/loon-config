name: 敏感信息检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描疑似凭据
        run: |
          set +e
          fail=0

          echo "::group::1. 私钥（base64 长度 >= 40）"
          if grep -rnE 'private-key[[:space:]]*=[[:space:]]*"[A-Za-z0-9+/]{40,}={0,2}"' \
               --include='*.conf' --include='*.yaml' --include='*.yml' --include='*.json' . ; then
            echo "::error::检测到疑似明文私钥"
            fail=1
          else
            echo "未发现"
          fi
          echo "::endgroup::"

          echo "::group::2. 非空的 secret / password 字段"
          if grep -rnE '(^|[[:space:]])(secret|password|passwd)[[:space:]]*:[[:space:]]*[^[:space:]"'"'"']' \
               --include='*.yaml' --include='*.yml' . | grep -vE ':[[:space:]]*(""|'"''"'|<[^>]*>)' ; then
            echo "::error::检测到非空的 secret/password 字段"
            fail=1
          else
            echo "未发现"
          fi
          echo "::endgroup::"

          echo "::group::3. 代理凭据（scheme, ip, port, user, pass 形式）"
          matched=$(grep -rnE '^[A-Za-z0-9_-]+ *= *[a-z]+, *[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+, *[0-9]+, *[^,]+, *[^, ]+$' \
               --include='*.conf' . \
               | grep -vE '(username|user|账号)[[:space:]]*,[[:space:]]*(password|pass|密码)[[:space:]]*$' \
               | grep -v '<')
          if [ -n "$matched" ]; then
            echo "$matched"
            echo "::error::检测到疑似代理认证凭据"
            fail=1
          else
            echo "未发现"
          fi
          echo "::endgroup::"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "提交被拦截：配置中疑似含有私密信息。"
            echo "请改用占位符（如 <client-private-key>、username、password），真实值保留在本地。"
            exit 1
          fi
          echo "检查通过，未发现明文凭据。"
