name: 每日刷新

# 每天做四件事，任何一件失败都能在 Step Summary 里看到原因：
#   1. 静态校验主配置（策略组引用、policy 是否存在、FINAL 收尾）
#   2. 从 Loon.conf 重建纯分流版 Loon-routing.conf（无 MITM / 脚本 / 插件）
#   3. 体检全部上游资源（kelee 的客户端门禁单独计数，不算失败）
#   4. 有变化才提交，无变化不留空提交
#
# 为什么是「重建」而不是手维护两份：分流规则和去广告插件的失效面完全不同，
# 但策略组、订阅过滤器、规则清单是同一套。派生能保证两边永远不分叉。

on:
  schedule:
    # UTC 01:17 = Asia/Shanghai 09:17
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "Loon.conf"
      - "Loon-minimal.conf"
      - "scripts/**"
      - ".github/workflows/refresh-upstreams.yml"

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: 校验 / 重建 / 体检
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 校验主配置
        run: python3 scripts/validate_config.py Loon.conf Loon-minimal.conf

      - name: 重建纯分流版
        run: |
          python3 scripts/build_routing.py
          python3 scripts/validate_config.py Loon-routing.conf

      - name: 检查分流版与主配置是否同步
        run: python3 scripts/build_routing.py --check

      - name: 上游体检
        id: upstream
        # 核心资源挂了不代表台账和日期不该更新 —— 先记账，最后再置失败。
        continue-on-error: true
        run: |
          python3 scripts/refresh_upstreams.py \
            --config Loon.conf \
            --output .upstream/upstreams.lock.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --strict

      - name: 提交刷新结果
        # 只在定时 / 手动触发时提交。push 触发的这轮只做校验和体检 ——
        # 否则每次人工改完配置，后面都会紧跟一条 bot 的 chore 提交，历史很吵。
        if: github.event_name != 'push'
        run: |
          files="Loon.conf Loon-routing.conf .upstream/upstreams.lock.json"
          if [[ -z "$(git status --porcelain -- $files)" ]]; then
            echo "无变化，跳过提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore: 每日刷新上游元数据与分流版 [skip ci]"
          git push

      - name: 配置概览
        if: always()
        run: python3 scripts/summarize.py >> "$GITHUB_STEP_SUMMARY"

      - name: 核心上游不可达则置失败
        if: steps.upstream.outcome == 'failure'
        run: |
          echo "::error::核心上游资源不可达（失败清单见 Step Summary），台账已生成但不视作通过。"
          exit 1
