rules:
  # === 家里 NAS（可选，默认关闭） ===
  # 在家访问 LAN 走直连即可。远程访问自托管服务时，改成只把具体端口放进 WG 隧道：
  # AND,((IP-CIDR,<NAS-IP>/32,no-resolve),(DST-PORT,<PORT>)),HomeNAS
  # 不要整段 LAN 进隧道 —— 内网 DNS 查询会被吸进去，再被对端白名单丢弃。
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # === 检测站 + STUN 固定走 AI ===
  # 这些域名不走代理时，会用本地 DNS 解析，检测站会看到本地出口；
  # STUN 走能转 UDP 的节点，保证 UDP 与 TCP 出口一致。
  - DOMAIN-SUFFIX,ip.net.coffee,AI
  - DOMAIN-SUFFIX,stun.l.google.com,Home-Proxy
  - DOMAIN-SUFFIX,stun.cloudflare.com,Home-Proxy

  # === 插件源/脚本源强制直连 ===
  # kelee.one 在 Cloudflare 后面，经代理出海会被下发 cf-mitigated: challenge。
  - DOMAIN-SUFFIX,kelee.one,DIRECT

  # === 屏蔽 iOS 系统更新（必须排在 Apple 白名单之前） ===
  # 这里 11 个 OTA 域也匹配 apple.com 后缀：先放白名单，屏蔽失效；
  # 先放 REJECT，白名单救不回来。这一对的顺序不能颠倒。
  - DOMAIN,swcdn.apple.com,REJECT
  - DOMAIN,swdist.apple.com,REJECT
  - DOMAIN,swdownload.apple.com,REJECT
  - DOMAIN,swscan.apple.com,REJECT
  - DOMAIN,swquery.apple.com,REJECT
  - DOMAIN,swpost.apple.com,REJECT
  - DOMAIN,mesu.apple.com,REJECT
  - DOMAIN,gdmf.apple.com,REJECT
  - DOMAIN,appldnld.apple.com,REJECT
  - DOMAIN,gg.apple.com,REJECT
  - DOMAIN,xp.apple.com,REJECT

  # === Apple 核心域名白名单（抢在远程去广告 REJECT 之前） ===
  - DOMAIN-SUFFIX,apple.com,Apple
  - DOMAIN-SUFFIX,icloud.com,Apple
  - DOMAIN-SUFFIX,icloud-content.com,Apple
  - DOMAIN-SUFFIX,me.com,Apple
  - DOMAIN-SUFFIX,mzstatic.com,Apple
  - DOMAIN-SUFFIX,cdn-apple.com,Apple
  - DOMAIN-SUFFIX,aaplimg.com,Apple
  - DOMAIN-SUFFIX,apple-cloudkit.com,Apple
  - DOMAIN-SUFFIX,apple-dns.net,Apple
  - DOMAIN-SUFFIX,itunes.com,Apple
  - DOMAIN-SUFFIX,itunes-apple.com,Apple

  # === 远程规则（Loon 的 [Remote Rule] 先于 GEOIP 与 FINAL 匹配） ===
  - RULE-SET,Advertising,REJECT
  - RULE-SET,AdRules,REJECT
  - RULE-SET,Speedtest,Speedtest

  - RULE-SET,AliPay,Finance
  - RULE-SET,UnionPay,Finance
  - RULE-SET,ICBC,Finance
  - RULE-SET,CCB,Finance
  - RULE-SET,BOC,Finance
  - RULE-SET,ABC,Finance
  - RULE-SET,CMB,Finance
  - RULE-SET,BOCOM,Finance
  - RULE-SET,CEB,Finance

  - RULE-SET,YouTube,YouTube
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Claude,Claude
  - RULE-SET,Gemini,Gemini
  - RULE-SET,Google,Google
  - RULE-SET,GitHub,GitHub
  - RULE-SET,Twitter,X
  - RULE-SET,Epic,Epic
  - RULE-SET,Steam,Steam
  - RULE-SET,Apple,Apple
  - RULE-SET,AI,AI
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Disney,Disney
  - RULE-SET,HBO,HBO
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Bilibili,Bilibili
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Instagram,Instagram
  - RULE-SET,Telegram,Telegram
  - RULE-SET,LinkedIn,LinkedIn
  - RULE-SET,Emby,Emby

  - RULE-SET,Direct,DIRECT
  - RULE-SET,ChinaMaxNoIP,DIRECT
  - RULE-SET,Proxy,Proxy

  # 兜底：规则没命中的 CN IP 直连，其余交给 Final。FINAL/MATCH 必须最后一条。
  - GEOIP,CN,DIRECT
  - MATCH,Final
