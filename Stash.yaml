rule-providers:
  # 两张去广告表都启用（2026-11-11）。体积差三个数量级，代价不同：
  #   Advertising  约 26 KB，几千条 —— 精准但覆盖窄。
  #   AdRules      208,515 条 DOMAIN-SUFFIX / 约 7.3 MB —— 广度换来的，classical
  #                解析在移动端内存与首次加载开销明显。嫌卡就先把 AdRules 注释掉；
  #                反过来如果误杀导致页面白屏，先关 Advertising。
  Advertising:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml
    path: ./rules/Advertising.yaml
