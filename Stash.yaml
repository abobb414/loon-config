# abobb's Stash 分流配置（纯分流版 / 无 MitM / 无 rewrite / 无脚本）
# 与 Loon-routing.conf 同源：策略组、过滤条件、规则顺序一致。
# Created: 2026-07-12
# Last Updated: 2026-11-11
#
# ── 为什么没有插件，也没有 MitM ───────────────────────────────────────────
#
# 1. 规则层 REJECT 不需要解密：按域名/连接直接拒掉，纯分流配置里照样有效。
# 2. Rewrite 层（改响应体、删 JSON 字段、mock 返回值）必须先 MitM 解密。
#    域名不在 mitm 列表里，HTTPS 就是一条密文隧道，rewrite 静默不执行，
#    Stash 不报错、日志也不提示，看起来「规则都在」而广告照播。
# 3. 把 mitm hostname 冻结在本文件 = 把解密范围冻结在抄写那一刻。App 换接口域名
#    （闲鱼 2026-11 就把下单/广告接口从 gw.m.goofish.com 挪到 acs.m.taobao.com）、
#    插件作者新增域名，清单都跟不上，最后得到「插件已加载、命中数为 0」。
#    去广告插件与脚本请自己订阅、自己维护，不要在主配置里保留快照。
#
# 需要去广告插件/脚本 → 用 Loon（.lpx/.js）或 Stash 自己的 rewrite/script，
# 订阅地址见 README「插件与脚本」一节；本仓库不转发、不镜像。
#
# ── 与 Loon 版的三处差异（不是笔误） ─────────────────────────────────────
#
# · kelee.one 只对 Loon 的 UA 放行，Stash 直接拉 .lsr 会 403，
#   所以两条 Speedtest 规则换成 blackmatrix7 的同名规则集。
# · Loon 的 [Remote Filter] 是节点集合，这里用「策略组 + use + filter」等价实现：
#   区域池用 url-test 先挑最快节点，外层 fallback 只判断这个池子还能不能用。
# · Loon 的 [Host] 是「域名 → DNS 服务器」，Clash 系的 hosts 只能写 IP，
#   所以改写到 dns.nameserver-policy。
#
# 三份配置（Loon-routing.conf / Stash.yaml / Clash.yaml）是各自维护的镜像，
# 改规则顺序、过滤条件、策略组时三份都要改。
# ─────────────────────────────────────────────────────────────────────────

mode: rule
log-level: info
ipv6: true
allow-lan: false

dns:
  ipv6: true

  # 纯 IP 的 DoH，不写 h3://（QUIC）形式：UDP/443 常被运营商 QoS，表现为解析偶发挂起。
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 订阅节点域名走独立解析链，不跟随分流规则，避免连接节点时形成递归查询。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # Stash 默认就是 Fake-IP：先回虚拟地址，建立连接时再按规则决定要不要真实解析。
  # 198.18.0.0/15 是 Fake-IP 池，不要把它写进任何绕过列表。
  fake-ip-range: 198.18.0.1/16

  # 以下域名必须返回真实地址：
  # · 网络连通性探测（msftconnecttest / msftncsi）
  # · 游戏主机的 NAT 探测（任天堂 / PlayStation / Xbox）
  # · 战网登录与更新
  # · 你自己的订阅节点域名后缀（Loon 的 real-ip 列表），按机场补在最后一行
  fake-ip-filter:
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
    # - '*.your-node-domain.com'

  # 原 Loon [Host]：这些域名固定用国内 DNS，避免 DoH/QUIC 解析路径影响长连接。
  nameserver-policy:
    '+.taobao.com': 223.5.5.5
    '+.tmall.com': 223.5.5.5
    '+.alicdn.com': 223.5.5.5
    '+.aliyun.com': 223.5.5.5
    '+.testflight.apple.com': 223.5.5.5
    '+.jd.com': 119.29.29.29
    '+.qq.com': 119.29.29.29
    '+.tencent.com': 119.29.29.29
    '+.weixin.com': 119.29.29.29
    '+.weixin.qq.com': 119.29.29.29
    '+.wechat.com': 119.29.29.29
    '+.qpic.cn': 119.29.29.29
    '+.163.com': 119.29.29.29
    '+.126.com': 119.29.29.29
    '+.126.net': 119.29.29.29
    '+.127.net': 119.29.29.29
    '+.netease.com': 119.29.29.29
    '+.mi.com': 119.29.29.29
    '+.xiaomi.com': 119.29.29.29
    '+.bilibili.com': 119.29.29.29
    'dl.google.com': 119.29.29.29
    'dl.l.google.com': 119.29.29.29

proxies:
  # 家里代理内核（mihomo mixed 端口）：用 socks5 才能转 UDP ASSOCIATE。
  # 地址是 RFC 5737 文档保留地址（192.0.2.0/24，公网不可达），换成你自己的内网地址与口令。
  - name: Home-Proxy
    type: socks5
    server: 192.0.2.10
    port: 7890
    username: "<username>"
    password: "<password>"
    udp: true
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 3

  # 家里 WireGuard：接口地址用 10.0.0.2（WG 常见网段），端点用 2001:db8::（RFC 3849 文档前缀），
  # 全是占位符。MTU 1280 兼容 IPv6 最小链路与蜂窝 PMTUD。
  - name: Home-NAS-WG
    type: wireguard
    server: 2001:db8::1
    port: 51820
    ip: 10.0.0.2
    private-key: "<client-private-key>"
    public-key: "<server-public-key>"
    dns: [223.5.5.5]
    mtu: 1280
    keepalive: 25

  # 住宅出口（链的队尾）：静态住宅 socks5，只有 TCP，所以 udp: false。
  # dialer-proxy 等价 Loon 的 [Proxy Chain]：先由 AI-Entry 那一跳拨号，再从这里出网。
  # 地址/端口/账号全是占位符；单独用慢到不可用（单连接 ~20 KB/s）。
  - name: US-Resi
    type: socks5
    server: 198.51.100.7
    port: 9004
    username: "<username>"
    password: "<password>"
    udp: false
    dialer-proxy: AI-Entry

proxy-providers:
  # ⚠ 订阅地址含 token，本仓库不保存。换成你自己的订阅地址即可；
  #   这两个名字（SubA-Sub / SubB-Sub）被下面的策略组引用，改名要一起改。
  SubA-Sub:
    url: https://example.com/sub-a-subscribe?token=YOUR_TOKEN
    path: ./providers/SubA-Sub.yaml
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 3
  SubB-Sub:
    url: https://example.com/sub-b-subscribe?token=YOUR_TOKEN
    path: ./providers/SubB-Sub.yaml
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 3

proxy-groups:
  # ── 节点池：等价 Loon [Remote Filter] ──────────────────────────────────
  # 只作为其他策略组的成员，hidden 后不占策略组列表。
  # 订阅头部那些「剩余流量 / 套餐到期」的占位行必须排掉，否则会被当成节点测速。
  - name: SubA-TW
    type: url-test
    use: [SubA-Sub]
    filter: '(?i)HINET'
    interval: 600
    hidden: true

  # 机房段节点：住宅节点全挂时保证仍从目标地区出网。
  - name: SubA-IDC
    type: url-test
    use: [SubA-Sub]
    filter: '(?i)^🧋台湾0[1-4]'
    interval: 600
    hidden: true

  # SubA 的剩余节点：排掉已经单独成池的 HINET 与订阅头部占位行。
  - name: SubA-Rest
    type: select
    use: [SubA-Sub]
    filter: '(?i)^(?!.*(剩余流量|距离下次|套餐到期|官网|过滤掉|HINET)).*'
    hidden: true

  # SubB 的台湾家宽（1x）：排掉 3x / 高倍与订阅头部占位行。
  - name: SubB-TW
    type: url-test
    use: [SubB-Sub]
    filter: '(?i)TW [0-9]+ ISP家宽'
    interval: 600
    hidden: true

  # 台湾家宽全集（1x + 3x）：3x 的命名是 `TW高倍家宽01 3x流量`，TW 后没有空格，
  # 需要单独一条分支，否则会被前一条的 `TW [0-9]+` 漏掉。
  - name: SubB-TW-All
    type: url-test
    use: [SubB-Sub]
    filter: '(?i)(TW [0-9]+ ISP家宽|TW高倍家宽[0-9]+ 3x流量)'
    interval: 600
    hidden: true

  - name: SubB-JP
    type: url-test
    use: [SubB-Sub]
    filter: '(?i)JP [0-9]+'
    interval: 600
    hidden: true

  - name: SubB-SG
    type: url-test
    use: [SubB-Sub]
    filter: '(?i)SG [0-9]+'
    interval: 600
    hidden: true

  # SubB 的剩余节点：排掉头部占位行与已经单独成池的 1x 台湾家宽。
  - name: SubB-Rest
    type: select
    use: [SubB-Sub]
    filter: '(?i)^(?!.*(剩余流量|距离下次|套餐到期|客服邮箱|支持AI|TW [0-9]+ ISP家宽)).*'
    hidden: true

  # ── 入口与兜底 ────────────────────────────────────────────────────────
  # Available：正常倍率的台湾家宽 -> 日本 -> 新加坡 -> Proxy。香港节点全部排除（高倍且不稳）。
  - name: Available
    type: fallback
    proxies: [SubB-TW, SubB-JP, SubB-SG, Proxy]
    interval: 600
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Available.png

  # select：手动挑主出口，候选是地区池 + 家里内核，不展开全量节点。
  - name: Proxy
    type: select
    proxies: [SubB-TW, SubB-Rest, SubA-TW, SubA-Rest, Home-Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Proxy.png

  - name: Final
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Final.png

  - name: HomeNAS
    type: select
    proxies: [Home-NAS-WG, DIRECT]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/HomeNAS.png

  - name: Finance
    type: select
    proxies: [DIRECT, Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Finance.png

  # 大合集：先挂地区池，让策略页默认落在可用节点上。
  - name: SubA
    type: select
    proxies: [SubA-TW, SubA-Rest]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/SnowStorm.png

  - name: SubB
    type: select
    proxies: [SubB-TW, SubB-Rest]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/SubB.png

  # AI 链的入口跳：设备先连这一跳，再由它去拨 US-Resi。只服务 AI，不碰主 Proxy 组。
  - name: AI-Entry
    type: select
    proxies: [SubB-TW, SubB-JP, SubA-TW]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Bard.png

  # AI：选到住宅链，住宅 IP 在 AI 站点上的信任度明显高于机房；后面挂台湾家宽做手动备选。
  # 链写在出口节点 US-Resi 的 dialer-proxy 上（Stash 没有独立的「链」对象）。
  - name: AI
    type: select
    proxies: [US-Resi, SubB-TW-All, SubA-TW, Home-Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/AI-v2.png

  - name: OpenAI
    type: select
    proxies: [AI]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/OpenAI.png

  # Claude 单独一组：Claude 规则集指向它，不再和 OpenAI/Gemini 共用 AI。
  # 默认选中 AI；需要时可以直接在这一组里挑具体节点池。
  - name: Claude
    type: select
    proxies: [AI, SubA-TW, SubB-TW-All, Home-Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/FlashBang.png

  - name: Gemini
    type: select
    proxies: [AI]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Gemini.png

  - name: Google
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Google.png

  - name: GitHub
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/GitHub.png

  - name: X
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/TwitterX.png

  # 游戏平台多给一个 DIRECT：下载/更新吃满家宽带宽，走机场只会白烧流量与倍率。
  - name: Epic
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/EpicGames.png

  - name: Steam
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Steam.png

  # Apple：默认 DIRECT 保证国内苹果服务直连；需要外区服务时手动切 Proxy。
  - name: Apple
    type: select
    proxies: [DIRECT, Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Apple.png

  - name: Microsoft
    type: select
    proxies: [DIRECT, Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Microsoft.png

  - name: Netflix
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Netflix.png

  - name: Disney
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Disney.png

  - name: HBO
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/HBO.png

  - name: Spotify
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Spotify.png

  - name: YouTube
    type: select
    proxies: [Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/YouTube.png

  - name: Bilibili
    type: select
    proxies: [DIRECT, Proxy]
    icon: https://raw.githubusercontent.com/abobb414/loon-config/main/IconSet/Color/Bilibili.png

